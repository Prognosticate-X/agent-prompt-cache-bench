[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-prompt-cache-bench"
version = "0.1.0"
description = "Wire-Level LLM Prompt Cache Benchmark & Schema Canonicalizer for AI Agent Frameworks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Prognosticate X", email = "Prognosticate@Outlook.fr" }
]
keywords = [
    "prompt-caching",
    "llm",
    "anthropic",
    "openai",
    "gemini",
    "agent",
    "json-schema",
    "wire-format",
    "benchmarks"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
agent-cache-bench = "agent_prompt_cache_bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_prompt_cache_bench*"]

[project.urls]
Homepage = "https://github.com/Prognosticate-X/agent-prompt-cache-bench"
Repository = "https://github.com/Prognosticate-X/agent-prompt-cache-bench"
"Bug Tracker" = "https://github.com/Prognosticate-X/agent-prompt-cache-bench/issues"

